<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedule 桌面日程</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
          <aside class="sidebar">
            <div class="brand">
              <span class="brand-mark" title="Schedule">S</span>
            </div>
            <nav class="nav">
              <button class="nav-item active" type="button" data-view="scheduleView" title="日程列表">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
              </button>
              <button class="nav-item" type="button" data-view="calendarView" title="日历视图">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
              </button>
              <button class="nav-item" type="button" data-view="categoryView" title="分类管理">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
              </button>
            </nav>
          </aside>

          <main class="main">
            <section id="scheduleView" class="page active">
              <header class="page-header">
                <div>
                  <p class="eyebrow">Today board</p>
                  <h2>日程</h2>
                </div>
                <button class="primary-icon-btn" id="newScheduleBtn" type="button" aria-label="新增日程" title="新增日程"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
              </header>

              <div class="toolbar">
                <input type="search" id="searchInput" placeholder="搜索日程名称或内容...." class="search-input" style="max-width: none; width: 100%;" />
                <label style="display: none;">
                  时间范围
                  <select id="timeFilter">
                    <option value="all">全部</option>
                    <option value="today" selected>今日</option>
                    <option value="tomorrow">明天</option>
                    <option value="week">本周</option>
                    <option value="month">本月</option>
                    <option value="next7days">未来 7 天</option>
                  </select>
                </label>
                <label style="display: none;">
                  分类
                  <select id="categoryFilter">
                    <option value="all">所有分类</option>
                    <option value="uncategorized">未分类</option>
                  </select>
                </label>
                <label style="display: none;">
                  排序
                  <select id="sortBy">
                    <option value="time">日程时间</option>
                    <option value="priority">优先级</option>
                  </select>
                </label>
              </div>

              <div id="listPanel" class="content-panel active list-layout-with-sidebar">
                <aside class="smart-sidebar">
                  <ul class="smart-list-filters" id="smartListFilters">
                    <li data-filter="today" class="active">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                      今天
                      <span class="count-badge" id="count-today">0</span>
                    </li>
                    <li data-filter="tomorrow">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                      明天
                      <span class="count-badge" id="count-tomorrow">0</span>
                    </li>
                    <li data-filter="next7days">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                      未来 7 天
                      <span class="count-badge" id="count-next7days">0</span>
                    </li>
                    <li data-filter="all">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                      全部日程
                      <span class="count-badge" id="count-all">0</span>
                    </li>
                  </ul>
                  <div class="sidebar-divider"></div>
                  <ul class="smart-list-filters" id="sidebarCategoryList">
                    <li data-category="all" class="active">
                      <span class="category-dot" style="background-color: var(--primary);"></span>
                      所有分类
                      <span class="count-badge" id="count-cat-all">0</span>
                    </li>
                  </ul>
                </aside>
                <div class="schedule-list-container">
                  <div class="schedule-list" id="scheduleList"></div>
                </div>
              </div>
            </section>

            
            <section id="calendarView" class="page">
              <header class="page-header">
                <div>
                  <p class="eyebrow">Monthly view</p>
                  <h2>日历</h2>
                </div>
                <button class="primary-icon-btn" id="newScheduleBtnCalendar" type="button" aria-label="新增日程" title="新增日程"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
              </header>


              <div id="calendarPanel" class="content-panel active calendar-layout">
                <section class="calendar-area">
                  <div class="calendar-header">
                    <div style="display: flex; gap: 8px; align-items: center;">
                      <button class="icon-button" id="prevMonthBtn" type="button" aria-label="上个月">&lt;</button>
                      <label class="month-picker-label">
                        <h3 id="calendarTitle"></h3>
                        <input type="month" id="monthPicker" class="hidden-picker" />
                      </label>
                      <button class="icon-button" id="nextMonthBtn" type="button" aria-label="下个月">&gt;</button>
                    </div>
                    <div style="display: flex; gap: 8px;">
                      <button class="plain-button" id="toggleViewBtn" type="button">视图: 圆点</button>
                      <button class="plain-button" id="todayBtn" type="button">今天</button>
                    </div>
                  </div>
                  <div class="week-row">
                    <span>一</span>
                    <span>二</span>
                    <span>三</span>
                    <span>四</span>
                    <span>五</span>
                    <span>六</span>
                    <span>日</span>
                  </div>
                  <div class="calendar-grid" id="calendarGrid"></div>
                </section>
                <aside class="day-detail">
                  <div class="day-detail-header">
                    <p class="eyebrow">当天内容</p>
                    <h3 id="selectedDateTitle"></h3>
                  </div>
                  <div id="selectedDateList" class="day-list"></div>
                </aside>
              </div>

            </section>
            <section id="categoryView" class="page">
              <header class="page-header">
                <div>
                  <p class="eyebrow">Color labels</p>
                  <h2>分类</h2>
                </div>
                <button class="primary-icon-btn" id="newCategoryBtn" type="button" aria-label="新增分类" title="新增分类"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
              </header>
              <div class="category-list" id="categoryList"></div>
            </section>
          </main>
    </div>

    <dialog id="scheduleDialog">
      <form method="dialog" class="dialog-form" id="scheduleForm">
        <header>
          <h3 id="scheduleDialogTitle">新增日程</h3>
          <button class="plain-button" type="button" data-close-dialog="scheduleDialog">关闭</button>
        </header>
        <input type="hidden" id="scheduleId" />
        <label>
          标题
          <input id="scheduleTitle" type="text" required maxlength="60" />
        </label>
        <label>
          内容
          <textarea id="scheduleContent" rows="4" maxlength="300"></textarea>
        </label>
        <div class="dialog-subtasks-container">
          <label>子任务</label>
          <div id="dialogSubtaskList" class="dialog-subtask-list"></div>
          <div class="dialog-subtask-input-row">
            <input type="text" id="newSubtaskTitle" placeholder="输入子任务内容" maxlength="60" />
            <button type="button" id="addSubtaskBtn" class="action-icon-btn" aria-label="添加" title="添加" style="background: var(--glass); border: 1px solid var(--line); border-radius: 8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
          </div>
        </div>
          <div class="form-grid">
            <label>
              开始时间
              <input id="scheduleStartTime" type="text" class="flatpickr-input" required />
            </label>
            <label>
              结束时间
              <input id="scheduleEndTime" type="text" class="flatpickr-input" />
            </label>
          </div>
        <div class="form-grid">
          <label>
            循环重复
            <select id="scheduleRecurrence">
              <option value="none">不重复</option>
              <option value="daily">每天</option>
              <option value="weekly">每周</option>
              <option value="monthly">每月</option>
            </select>
          </label>
          <label>
            分类
            <select id="scheduleCategory"></select>
          </label>
        </div>
        <div class="form-grid">
          <label>
            优先级
            <select id="schedulePriority">
              <option value="low">低</option>
              <option value="medium" selected>中</option>
              <option value="high">高</option>
              <option value="urgent">紧急</option>
            </select>
          </label>
          <label>
            标签
            <input id="scheduleTags" type="text" placeholder="输入标签，用逗号或空格分割" maxlength="100" />
          </label>
        </div>
        <div class="form-grid">
          <label>
            状态
            <select id="scheduleStatus">
              <option value="pending">未开始</option>
              <option value="in-progress">进行中</option>
              <option value="completed">已完成</option>
              <option value="delayed">已延期</option>
            </select>
          </label>
          <label>
            提醒设置
            <select id="scheduleReminder">
              <option value="none">无提醒</option>
              <option value="10m">提前 10 分钟</option>
              <option value="30m">提前 30 分钟</option>
              <option value="1h">提前 1 小时</option>
            </select>
          </label>
        </div>
        <div class="check-row">
          <label>
            <input id="scheduleImportant" type="checkbox" />
            重点内容
          </label>
        </div>
        <footer>
          <button class="plain-button" type="button" data-close-dialog="scheduleDialog">取消</button>
          <button class="primary-button" type="submit">保存</button>
        </footer>
      </form>
    </dialog>

    <dialog id="categoryDialog">
      <form method="dialog" class="dialog-form" id="categoryForm">
        <header>
          <h3 id="categoryDialogTitle">新增分类</h3>
          <button class="plain-button" type="button" data-close-dialog="categoryDialog">关闭</button>
        </header>
        <input type="hidden" id="categoryId" />
        <label>
          分类名称
          <input id="categoryName" type="text" required maxlength="30" />
        </label>
        <div class="form-grid">
          <label>
            分类颜色
            <input id="categoryColor" type="color" value="#2563eb" />
          </label>
          <label>
            备注
            <input id="categoryNote" type="text" maxlength="80" />
          </label>
        </div>
        <footer>
          <button class="plain-button" type="button" data-close-dialog="categoryDialog">取消</button>
          <button class="primary-button" type="submit">保存</button>
        </footer>
      </form>
    </dialog>

    <dialog id="confirmDialog" style="max-width: 320px; padding: 20px;">
      <header style="margin-bottom: 12px; border: none; padding: 0;">
        <h3 id="confirmDialogTitle" style="font-size: 16px;">确认操作</h3>
      </header>
      <p id="confirmDialogMessage" style="margin-bottom: 20px; font-size: 14px; color: var(--text);"></p>
      <div class="card-actions" style="justify-content: flex-end; gap: 10px;">
        <button class="plain-button" type="button" id="confirmDialogCancelBtn">取消</button>
        <button class="danger-button" type="button" id="confirmDialogConfirmBtn">确定</button>
      </div>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
