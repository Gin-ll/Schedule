<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedule 桌面日程</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
          <aside class="sidebar">
            <div class="brand">
              <span class="brand-mark">S</span>
              <div>
                <h1>Schedule</h1>
                <p>桌面日程</p>
              </div>
            </div>
            <nav class="nav">
              <button class="nav-item active" type="button" data-view="scheduleView">日程</button>
              <button class="nav-item" type="button" data-view="categoryView">分类</button>
            </nav>
          </aside>

          <main class="main">
            <section id="scheduleView" class="page active">
              <header class="page-header">
                <div>
                  <p class="eyebrow">Today board</p>
                  <h2>日程</h2>
                </div>
                <button class="primary-icon-btn" id="newScheduleBtn" type="button" aria-label="新增日程" title="新增日程"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
              </header>

              <div class="toolbar">
                <input type="search" id="searchInput" placeholder="搜索日程名称或内?.." class="search-input" />
                <label>
                  时间范围
                  <select id="timeFilter">
                    <option value="all">全部</option>
                    <option value="today">今日</option>
                    <option value="week">本周</option>
                    <option value="month">本月</option>
                  </select>
                </label>
                <label>
                  分类
                  <select id="categoryFilter">
                    <option value="all">所有分?/option>
                  </select>
                </label>
                <label>
                  排序
                  <select id="sortBy">
                    <option value="time">日程时间</option>
                    <option value="priority">优先?/option>
                  </select>
                </label>
                <div class="segmented" aria-label="视图切换">
                  <button class="active" id="listModeBtn" type="button">列表</button>
                  <button id="calendarModeBtn" type="button">日历</button>
                </div>
              </div>

              <div id="listPanel" class="content-panel active">
                <div class="schedule-list" id="scheduleList"></div>
              </div>

              <div id="calendarPanel" class="content-panel calendar-layout">
                <section class="calendar-area">
                  <div class="calendar-header">
                    <div style="display: flex; gap: 8px; align-items: center;">
                      <button class="icon-button" id="prevMonthBtn" type="button" aria-label="上个?>?/button>
                      <label class="month-picker-label">
                        <h3 id="calendarTitle"></h3>
                        <input type="month" id="monthPicker" class="hidden-picker" />
                      </label>
                      <button class="icon-button" id="nextMonthBtn" type="button" aria-label="下个?>?/button>
                    </div>
                    <div style="display: flex; gap: 8px;">
                      <button class="plain-button" id="toggleViewBtn" type="button">视图: 圆点</button>
                      <button class="plain-button" id="todayBtn" type="button">今天</button>
                    </div>
                  </div>
                  <div class="week-row">
                    <span>一</span>
                    <span>?/span>
                    <span>?/span>
                    <span>?/span>
                    <span>?/span>
                    <span>?/span>
                    <span>?/span>
                  </div>
                  <div class="calendar-grid" id="calendarGrid"></div>
                </section>
                <aside class="day-detail">
                  <div class="day-detail-header">
                    <p class="eyebrow">当天内容</p>
                    <h3 id="selectedDateTitle"></h3>
                  </div>
                  <div id="selectedDateList" class="day-list"></div>
                </aside>
              </div>
            </section>

            <section id="categoryView" class="page">
              <header class="page-header">
                <div>
                  <p class="eyebrow">Color labels</p>
                  <h2>分类</h2>
                </div>
                <button class="primary-icon-btn" id="newCategoryBtn" type="button" aria-label="新增分类" title="新增分类"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
              </header>
              <div class="category-list" id="categoryList"></div>
            </section>
          </main>
    </div>

    <dialog id="scheduleDialog">
      <form method="dialog" class="dialog-form" id="scheduleForm">
        <header>
          <h3 id="scheduleDialogTitle">新增日程</h3>
          <button class="plain-button" type="button" data-close-dialog="scheduleDialog">关闭</button>
        </header>
        <input type="hidden" id="scheduleId" />
        <label>
          标题
          <input id="scheduleTitle" type="text" required maxlength="60" />
        </label>
        <label>
          内容
          <textarea id="scheduleContent" rows="4" maxlength="300"></textarea>
        </label>
        <div class="dialog-subtasks-container">
          <label>子任?/label>
          <div id="dialogSubtaskList" class="dialog-subtask-list"></div>
          <div class="dialog-subtask-input-row">
            <input type="text" id="newSubtaskTitle" placeholder="输入子任务内? maxlength="60" />
            <button type="button" id="addSubtaskBtn" class="action-icon-btn" aria-label="添加" title="添加" style="background: var(--glass); border: 1px solid var(--line); border-radius: 8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
          </div>
        </div>
          <div class="form-grid">
            <label>
              开始时?
              <input id="scheduleStartTime" type="text" class="flatpickr-input" required />
            </label>
            <label>
              结束时间
              <input id="scheduleEndTime" type="text" class="flatpickr-input" />
            </label>
          </div>
        <div class="form-grid">
          <label>
            循环重复
            <select id="scheduleRecurrence">
              <option value="none">不重?/option>
              <option value="daily">每天</option>
              <option value="weekly">每周</option>
              <option value="monthly">每月</option>
            </select>
          </label>
          <label>
            分类
            <select id="scheduleCategory"></select>
          </label>
        </div>
        <div class="form-grid">
          <label>
            优先?
            <select id="schedulePriority">
              <option value="low">?/option>
              <option value="medium" selected>?/option>
              <option value="high">?/option>
              <option value="urgent">紧?/option>
            </select>
          </label>
          <label>
            标签
            <input id="scheduleTags" type="text" placeholder="输入标签，用逗号或空格分? maxlength="100" />
          </label>
        </div>
        <div class="form-grid">
          <label>
            状?
            <select id="scheduleStatus">
              <option value="pending">未开?/option>
              <option value="in-progress">进行?/option>
              <option value="completed">已完?/option>
              <option value="delayed">已延?/option>
            </select>
          </label>
          <label>
            提醒设置
            <select id="scheduleReminder">
              <option value="none">无提?/option>
              <option value="10m">提前 10 分钟</option>
              <option value="30m">提前 30 分钟</option>
              <option value="1h">提前 1 小时</option>
            </select>
          </label>
        </div>
        <div class="check-row">
          <label>
            <input id="scheduleImportant" type="checkbox" />
            重点内容
          </label>
        </div>

        
        <footer>
          <button class="plain-button" type="button" data-close-dialog="scheduleDialog">取消</button>
          <button class="primary-button" type="submit">保存</button>
        </footer>
      </form>
    </dialog>

    <dialog id="categoryDialog">
      <form method="dialog" class="dialog-form" id="categoryForm">
        <header>
          <h3 id="categoryDialogTitle">新增分类</h3>
          <button class="plain-button" type="button" data-close-dialog="categoryDialog">关闭</button>
        </header>
        <input type="hidden" id="categoryId" />
        <label>
          分类名称
          <input id="categoryName" type="text" required maxlength="30" />
        </label>
        <div class="form-grid">
          <label>
            分类颜色
            <input id="categoryColor" type="color" value="#2563eb" />
          </label>
          <label>
            备注
            <input id="categoryNote" type="text" maxlength="80" />
          </label>
        </div>
        <footer>
          <button class="plain-button" type="button" data-close-dialog="categoryDialog">取消</button>
          <button class="primary-button" type="submit">保存</button>
        </footer>
      </form>
    </dialog>

        <dialog id="confirmDialog" style="max-width: 320px; padding: 20px;">
      <header style="margin-bottom: 12px; border: none; padding: 0;">
        <h3 id="confirmDialogTitle" style="font-size: 16px;">确认操作</h3>
      </header>
      <p id="confirmDialogMessage" style="margin-bottom: 20px; font-size: 14px; color: var(--text);"></p>
      <div class="card-actions" style="justify-content: flex-end; gap: 10px;">
        <button class="plain-button" type="button" id="confirmDialogCancelBtn">取消</button>
        <button class="danger-button" type="button" id="confirmDialogConfirmBtn">确定</button>
      </div>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
